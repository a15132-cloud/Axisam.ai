[project]
name = "axiscam-orchestrator"
version = "0.1.0"
description = "Axiscam agent orchestrator: vision extraction, knowledge base, geometry bridge, CAM simulation, Claude tool-use loop."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "python-multipart>=0.0.12",
    "cadquery>=2.5,<2.9",
    "pypdf>=5.0",
    "aiofiles>=24.1",
    "ezdxf>=1.3",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
