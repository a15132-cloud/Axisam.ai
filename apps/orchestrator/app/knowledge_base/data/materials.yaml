# Base de conocimiento de materiales.
#
# SEED DATA: valores de referencia tomados de manuales generales de
# maquinado (Machinery's Handbook / catalogos de herramienta genericos).
# DEBEN ser validados y ajustados por el maquinista del taller antes de
# usarse en produccion real. Cada material tiene un campo `validado_por`
# que debe llenarse una vez revisado.
#
# maquinabilidad: indice relativo (acero 1212 = 100 referencia AISI)
# vc_recomendada_m_min: velocidad de corte recomendada en fresado con
#   fresa de carburo recubierta, como punto de partida conservador.

