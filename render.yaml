# Render Blueprint: despliega apps/orchestrator (el backend Python) con un
# clic. En Render: "New +" -> "Blueprint" -> conecta este repo -> Render lee
# este archivo automáticamente y crea el servicio.
#
# Por qué el backend no puede vivir en Vercel: Vercel solo sirve apps/web
# (la interfaz estática). El backend es un proceso FastAPI de larga
# duración con una dependencia nativa pesada (cadquery/OpenCascade) - no
# cabe en el modelo de funciones serverless de Vercel. Necesita un host
# de "servicio web" normal como este.
services:
  - type: web
    name: axiscam-orchestrator
    runtime: docker
    dockerfilePath: ./apps/orchestrator/Dockerfile
    dockerContext: ./apps/orchestrator
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: axiscam-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # Necesaria para que el chat y la lectura de planos funcionen. Es la
      # ÚNICA key que existe - tus clientes nunca ven ni configuran nada,
      # exactamente igual que en Perplexity/Grok/ChatGPT (ellos tampoco te
      # piden una API key, la empresa la paga por detrás). Consíguela en
      # https://console.anthropic.com/settings/keys - configura ahí mismo
      # un límite de gasto mensual para no llevarte sorpresas de facturación
      # (ver sección "Evitar quedarte sin créditos" en el README).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AXISCAM_STORAGE_DIR
        value: /data
      # Le dice al backend que /data DEBE ser un disco persistente real -
      # si en algun momento no lo es (justo despues de un redeploy, mientras
      # el disco se reconecta a la nueva instancia), un proyecto que
      # "desaparece" momentaneamente se reporta como error temporal (503,
      # "espera unos segundos") en vez de como 404 "no encontrado" (que
      # suena a perdida permanente de datos). Sin esta bandera explicita el
      # backend no puede distinguir esa condicion transitoria de un
      # despliegue local/de pruebas que nunca tuvo disco persistente.
      - key: AXISCAM_STORAGE_PERSISTENTE
        value: "true"

# Nota honesta sobre almacenamiento: este blueprint ya pide un disco
# persistente montado en /data (bloque `disk:` arriba), pero eso SOLO
# funciona en el plan "Starter" o superior - por eso `plan: starter` en
# vez de "free". El plan "free" de Render NO soporta discos persistentes:
# con "free", los proyectos/planos/STEP/STL/G-code generados se pierden en
# CADA redeploy y en cada reinicio por inactividad (~15 min sin uso), sin
# excepción. Si tu servicio en Render sigue en el plan "free", tienes que
# cambiarlo a "Starter" (o superior) manualmente en el dashboard de
# Render - este archivo no puede cobrarte ni cambiarte el plan por su
# cuenta, eso lo confirmas tú ahí. El costo exacto del plan Starter
# puedes verlo en el dashboard de Render antes de confirmar el cambio.
